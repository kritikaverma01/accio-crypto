
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Tracker</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #191919;
            color: #f5f5f5;
            font-family: Arial, sans-serif;
            padding: 50px 7%;
        }

        h1 {
            text-align: center;
            margin-bottom: 35px;
            font-size: 32px;
        }

        .container {
            max-width: 1250px;
            margin: auto;
        }

        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 18px 22px;
            background: transparent;
            border: 1px solid #888;
            color: white;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #fff;
        }

        input::placeholder {
            color: #ddd;
        }

        button {
            padding: 15px 20px;
            background: transparent;
            color: white;
            border: 1px solid #888;
            font-size: 15px;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.3s;
        }

        button:hover {
            background: #333;
            border-color: white;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        tbody tr {
            border-bottom: 1px solid #888;
            transition: background 0.2s;
        }

        tbody tr:hover {
            background: #252525;
        }

        td {
            padding: 25px 12px;
            font-size: 18px;
            white-space: nowrap;
        }

        .coin-info {
            display: flex;
            align-items: center;
            gap: 15px;
            min-width: 190px;
        }

        .coin-info img {
            width: 38px;
            height: 38px;
            object-fit: contain;
        }

        .symbol {
            text-transform: uppercase;
            color: #ddd;
        }

        .positive {
            color: #4caf50;
        }

        .negative {
            color: #f44336;
        }

        .market-cap {
            min-width: 240px;
            text-align: right;
        }

        .message {
            text-align: center;
            padding: 40px;
            color: #bbb;
            font-size: 18px;
        }

        .footer {
            text-align: center;
            margin-top: 35px;
            color: #888;
            font-size: 13px;
        }

        @media (max-width: 768px) {
            body {
                padding: 25px 15px;
            }

            h1 {
                font-size: 25px;
            }

            .controls {
                flex-direction: column;
                gap: 12px;
            }

            input, button {
                width: 100%;
            }

            td {
                padding: 18px 10px;
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Cryptocurrency Tracker</h1>

        <div class="controls">

            <input
                type="text"
                id="searchInput"
                placeholder="Search By Name or Symbol"
            >

            <button id="marketSort">
                Sort By Mkt Cap
            </button>

            <button id="changeSort">
                Sort by Percentage
            </button>

            <button id="refreshBtn">
                Refresh
            </button>

        </div>

        <div class="table-wrapper">

            <table>

                <tbody id="cryptoTable">

                    <tr>
                        <td colspan="6" class="message">
                            Loading cryptocurrency data...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

        <div class="footer">
            Cryptocurrency data powered by CoinGecko API
        </div>

    </div>


    <script>

        // CoinGecko API endpoint
        const API_URL =
        "https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=10&page=1&sparkline=false";


        // HTML elements
        const cryptoTable = document.getElementById("cryptoTable");

        const searchInput = document.getElementById("searchInput");

        const marketSort = document.getElementById("marketSort");

        const changeSort = document.getElementById("changeSort");

        const refreshBtn = document.getElementById("refreshBtn");


        // Store cryptocurrency data
        let cryptoData = [];

        let marketAscending = false;

        let changeAscending = false;


        // =====================================
        // METHOD 1: FETCH USING .THEN()
        // =====================================

        function fetchCryptoWithThen() {

            cryptoTable.innerHTML = `
                <tr>
                    <td colspan="6" class="message">
                        Loading cryptocurrency data...
                    </td>
                </tr>
            `;

            fetch(API_URL)

                .then(response => {

                    // Check if response is successful
                    if (!response.ok) {
                        throw new Error("API request failed: " + response.status);
                    }

                    return response.json();

                })

                .then(data => {

                    // Store API response
                    cryptoData = data;

                    // Display data in table
                    displayCrypto(cryptoData);

                    console.log("Data fetched using .then():", data);

                })

                .catch(error => {

                    console.error("Error:", error);

                    cryptoTable.innerHTML = `
                        <tr>
                            <td colspan="6" class="message">
                                Unable to load data. Please try again.
                            </td>
                        </tr>
                    `;

                });

        }


        // =====================================
        // METHOD 2: FETCH USING ASYNC/AWAIT
        // =====================================

        async function fetchCryptoWithAsync() {

            cryptoTable.innerHTML = `
                <tr>
                    <td colspan="6" class="message">
                        Refreshing cryptocurrency data...
                    </td>
                </tr>
            `;

            try {

                // Fetch data from API
                const response = await fetch(API_URL);

                if (!response.ok) {
                    throw new Error("API request failed: " + response.status);
                }

                // Convert response into JSON
                const data = await response.json();

                // Store cryptocurrency data
                cryptoData = data;

                // Display cryptocurrency data
                displayCrypto(cryptoData);

                console.log("Data fetched using async/await:", data);

            }

            catch (error) {

                console.error("Error:", error);

                cryptoTable.innerHTML = `
                    <tr>
                        <td colspan="6" class="message">
                            Unable to load data. Please try again.
                        </td>
                    </tr>
                `;

            }

        }


        // =====================================
        // DISPLAY DATA IN TABLE
        // =====================================

        function displayCrypto(data) {

            cryptoTable.innerHTML = "";

            if (data.length === 0) {

                cryptoTable.innerHTML = `
                    <tr>
                        <td colspan="6" class="message">
                            No cryptocurrencies found!
                        </td>
                    </tr>
                `;

                return;
            }


            data.forEach(coin => {

                const row = document.createElement("tr");

                const percentage = coin.price_change_percentage_24h;

                const changeClass =
                    percentage >= 0 ? "positive" : "negative";

                const formattedPercentage =
                    percentage == null
                        ? "N/A"
                        : percentage.toFixed(2) + "%";


                row.innerHTML = `

                    <td>
                        <div class="coin-info">

                            <img
                                src="${coin.image}"
                                alt="${coin.name}"
                                onerror="this.style.display='none'"
                            >

                            <span>${coin.name}</span>

                        </div>
                    </td>

                    <td class="symbol">
                        ${coin.symbol}
                    </td>

                    <td>
                        ${formatCurrency(coin.current_price)}
                    </td>

                    <td>
                        ${formatCurrency(coin.total_volume)}
                    </td>

                    <td class="${changeClass}">
                        ${formattedPercentage}
                    </td>

                    <td class="market-cap">
                        Mkt Cap: ${formatCurrency(coin.market_cap)}
                    </td>

                `;

                cryptoTable.appendChild(row);

            });

        }


        // =====================================
        // FORMAT CURRENCY
        // =====================================

        function formatCurrency(value) {

            if (value == null) return "N/A";

            return new Intl.NumberFormat("en-US", {
                style: "currency",
                currency: "USD",
                maximumFractionDigits: 2
            }).format(value);

        }


        // =====================================
        // SEARCH FUNCTIONALITY
        // =====================================

        searchInput.addEventListener("input", function() {

            const searchValue = searchInput.value
                .trim()
                .toLowerCase();

            // Filter by name or symbol
            const filteredData = cryptoData.filter(coin => {

                return (
                    coin.name.toLowerCase().includes(searchValue) ||
                    coin.symbol.toLowerCase().includes(searchValue)
                );

            });

            displayCrypto(filteredData);

        });


        // =====================================
        // SORT BY MARKET CAPITALIZATION
        // =====================================

        marketSort.addEventListener("click", function() {

            marketAscending = !marketAscending;

            const sortedData = [...cryptoData].sort((a, b) => {

                return marketAscending
                    ? a.market_cap - b.market_cap
                    : b.market_cap - a.market_cap;

            });

            marketSort.textContent = marketAscending
                ? "Market Cap ↑"
                : "Market Cap ↓";

            displayCrypto(sortedData);

        });


        // =====================================
        // SORT BY PERCENTAGE CHANGE
        // =====================================

        changeSort.addEventListener("click", function() {

            changeAscending = !changeAscending;

            const sortedData = [...cryptoData].sort((a, b) => {

                const valueA =
                    a.price_change_percentage_24h ?? -Infinity;

                const valueB =
                    b.price_change_percentage_24h ?? -Infinity;

                return changeAscending
                    ? valueA - valueB
                    : valueB - valueA;

            });

            changeSort.textContent = changeAscending
                ? "Percentage ↑"
                : "Percentage ↓";

            displayCrypto(sortedData);

        });


        // =====================================
        // REFRESH USING ASYNC/AWAIT
        // =====================================

        refreshBtn.addEventListener("click", function() {

            fetchCryptoWithAsync();

        });


        // =====================================
        // INITIAL API CALL USING .THEN()
        // =====================================

        fetchCryptoWithThen();

    </script>

</body>
</html>
